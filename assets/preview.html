<div id="robot-sim-viz" style="width:100%; min-height:560px; position:relative;">
  <style>

    #rsv-stats { color:#94a3b8; font-size:12px; text-align:right; text-shadow:0 1px 4px rgba(0,0,0,.8); pointer-events:none; font-variant-numeric:tabular-nums; }

    #rsv-controls button:hover { background:rgba(71,85,105,.9); }
    #rsv-slider { width:160px; accent-color:#3b82f6; }
    #rsv-legend { position:absolute; bottom:12px; right:12px; display:flex; flex-direction:column; gap:4px; z-index:5; background:rgba(15,23,42,.85); padding:8px 12px; border-radius:8px; backdrop-filter:blur(8px); }

    .rsv-legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    #rsv-robot-tabs { position:absolute; top:38px; left:10px; display:flex; gap:6px; z-index:5; }
    #rsv-robot-tabs button { background:rgba(30,41,59,.8); border:1px solid rgba(100,116,139,.3); color:#94a3b8; border-radius:14px; padding:3px 12px; font-size:12px; cursor:pointer; transition:all .2s; backdrop-filter:blur(4px); }
    #rsv-robot-tabs button:hover { color:#e2e8f0; }
    #rsv-robot-tabs button.active { background:rgba(59,130,246,.3); border-color:rgba(59,130,246,.6); color:#93c5fd; }

  (function() {
    var DATA = ANIM_DATA;
    var canvas = document.getElementById('rsv-canvas');
    var wrap = document.getElementById('rsv-canvas-wrap');
    var statsEl = document.getElementById('rsv-stats');
    var timeEl = document.getElementById('rsv-time');
    var slider = document.getElementById('rsv-slider');
    var playBtn = document.getElementById('rsv-play');
    var resetBtn = document.getElementById('rsv-reset');
    var tabBtns = document.querySelectorAll('#rsv-robot-tabs button');

    // ================================================================
    // Coordinate system: Right-Forward-Up (X=Right, Y=Forward, Z=Up)
    // Ground plane is Z=0. Robot moves on this plane.
    //
    // Our simulation data uses X=forward, Y=left, Z=up.
    // We remap sim→RFU:  RFU_X = sim_Y,  RFU_Y = sim_X,  RFU_Z = sim_Z
    // (sim forward→RFU forward=Y, sim left→RFU right=X)
    // ================================================================

    function sim2rfu(x, y, z) {
      // sim (X=forward, Y=left, Z=up) → RFU (X=right, Y=forward, Z=up)
      return [y, x, z];
    }

    // ---- Three.js setup ----
    // We use Three.js in its native Y-up mode but position the camera
    // so that Z appears as the vertical (up) axis on screen.
    // Setting scene.up = (0,0,1) tells Three.js that Z is up.
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);
    scene.fog = new THREE.Fog(0x0a0e14, 10, 25);

    // Tell Three.js Z is up (not the default Y)
    scene.up.set(0, 0, 1);

    var camera = new THREE.PerspectiveCamera(55, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    camera.up.set(0, 0, 1);  // Camera also uses Z-up

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);

    // ---- Lights ----
    scene.add(new THREE.AmbientLight(0x6080a0, 0.6));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(3, -5, 8);  // Light from above-front-right in RFU
    scene.add(dirLight);
    scene.add(new THREE.HemisphereLight(0x8899bb, 0x223344, 0.4));

    // ---- Ground grid at Z=0 (XY plane) ----
    // Built directly in RFU coordinates: X=right, Y=forward, Z=up.
    // Grid lines in the XY plane at Z=0.
    var gridMat = new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.5 });
    var gridPts = [];
    var gridSize = 8, gridDiv = 16, gridStep = gridSize / gridDiv;
    for (var i = 0; i <= gridDiv; i++) {
      var v = -gridSize / 2 + i * gridStep;
      // Lines along Y (forward direction) at various X
      gridPts.push(new THREE.Vector3(v, -gridSize/2, 0), new THREE.Vector3(v, gridSize/2, 0));
      // Lines along X (right direction) at various Y
      gridPts.push(new THREE.Vector3(-gridSize/2, v, 0), new THREE.Vector3(gridSize/2, v, 0));
    }
    var gridGeo = new THREE.BufferGeometry().setFromPoints(gridPts);
    var grid = new THREE.LineSegments(gridGeo, gridMat);
    grid.position.z = -0.7;  // Just below the lowest terrain
    scene.add(grid);

    // ---- Axes helper at origin: X=red(right), Y=green(forward), Z=blue(up) ----
    // Custom axes with labels via colored lines
    var axisLen = 0.8;
    var xAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(axisLen,0,0)]);
    var yAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,axisLen,0)]);
    var zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,axisLen)]);
    scene.add(new THREE.Line(xAxisGeo, new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 2 })));  // X red = right
    scene.add(new THREE.Line(yAxisGeo, new THREE.LineBasicMaterial({ color: 0x22c55e, linewidth: 2 })));  // Y green = forward
    scene.add(new THREE.Line(zAxisGeo, new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2 })));  // Z blue = up

    // Axis label spheres at tips
    var tipGeo = new THREE.SphereGeometry(0.04, 8, 6);
    var xTip = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    xTip.position.set(axisLen, 0, 0);
    var yTip = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: 0x22c55e }));
    yTip.position.set(0, axisLen, 0);
    var zTip = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: 0x3b82f6 }));
    zTip.position.set(0, 0, axisLen);
    scene.add(xTip); scene.add(yTip); scene.add(zTip);

    // ---- 3DGS splats (remapped to RFU) ----
    var splatGroup = new THREE.Group();
    var splatGeo = new THREE.SphereGeometry(1, 8, 6);
    DATA.splats.forEach(function(s) {
      var c = new THREE.Color(s[3], s[4], s[5]);
      var mat = new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: 0.75 });
      var mesh = new THREE.Mesh(splatGeo, mat);
      var p = sim2rfu(s[0], s[1], s[2]);
      mesh.position.set(p[0], p[1], p[2]);
      mesh.scale.set(0.18, 0.18, 0.04);  // Flat ellipsoids
      splatGroup.add(mesh);
    });
    scene.add(splatGroup);

    // ---- Robot ----
    var currentRobot = 'hexapod';
    var robotGroup = new THREE.Group();
    scene.add(robotGroup);
    var trailLine = null;
    var trailPoints = [];

    function clearRobot() {
      while (robotGroup.children.length > 0) {
        var c = robotGroup.children[0];
        robotGroup.remove(c);
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      }
      if (trailLine) {
        scene.remove(trailLine);
        trailLine.geometry.dispose();
        trailLine.material.dispose();
        trailLine = null;
      }
      trailPoints = [];
    }

    var bodyMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 60 });
    var legMat = new THREE.LineBasicMaterial({ color: 0x60a5fa });
    var footGeo = new THREE.SphereGeometry(0.035, 10, 8);
    var hipGeo = new THREE.SphereGeometry(0.04, 8, 6);

    function buildRobot(rtype) {
      clearRobot();
      var r = DATA.robots[rtype];
      var legNames = Object.keys(r.h);

      var bodySize = rtype === 'biped' ? 0.10 : rtype === 'quadruped' ? 0.08 : 0.07;
      var bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(bodySize, 16, 12), bodyMat);
      bodyMesh.name = 'body';
      robotGroup.add(bodyMesh);

      if (rtype === 'biped') {
        var torsoMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.08, 0.30, 10), bodyMat);
        torsoMesh.name = 'torso';
        robotGroup.add(torsoMesh);
      }

      legNames.forEach(function(name) {
        var hip = new THREE.Mesh(hipGeo, new THREE.MeshPhongMaterial({ color: 0x475569 }));
        hip.name = 'hip_' + name;
        robotGroup.add(hip);

        var lineGeo = new THREE.BufferGeometry();
        lineGeo.setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        var line = new THREE.Line(lineGeo, legMat);
        line.name = 'leg_' + name;
        robotGroup.add(line);

        var foot = new THREE.Mesh(footGeo, new THREE.MeshPhongMaterial({ color: 0x22c55e }));
        foot.name = 'foot_' + name;
        robotGroup.add(foot);
      });
    }

    function updateRobot(rtype, frameIdx) {
      var r = DATA.robots[rtype];
      var frame = r.frames[frameIdx];
      var base = sim2rfu(frame.b[0], frame.b[1], frame.b[2]);

      var body = robotGroup.getObjectByName('body');
      if (body) body.position.set(base[0], base[1], base[2]);

      var torso = robotGroup.getObjectByName('torso');
      if (torso) torso.position.set(base[0], base[1], base[2] + 0.18);

      // Trail
      trailPoints.push(new THREE.Vector3(base[0], base[1], base[2]));
      if (trailPoints.length > 120) trailPoints.shift();
      if (trailLine) {
        scene.remove(trailLine);
        trailLine.geometry.dispose();
        trailLine.material.dispose();
      }
      if (trailPoints.length >= 2) {
        var tg = new THREE.BufferGeometry().setFromPoints(trailPoints);
        trailLine = new THREE.Line(tg, new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 }));
        scene.add(trailLine);
      }

      // Legs
      var legNames = Object.keys(r.h);
      legNames.forEach(function(name) {
        var hipOff = sim2rfu(r.h[name][0], r.h[name][1], r.h[name][2]);
        var hipPos = [base[0] + hipOff[0], base[1] + hipOff[1], base[2] + hipOff[2]];

        var hip = robotGroup.getObjectByName('hip_' + name);
        if (hip) hip.position.set(hipPos[0], hipPos[1], hipPos[2]);

        var footData = frame.f[name];
        var foot = robotGroup.getObjectByName('foot_' + name);
        if (foot && footData) {
          var fp = sim2rfu(footData[0], footData[1], footData[2]);
          foot.position.set(fp[0], fp[1], fp[2]);
          var isContact = frame.c[name];
          foot.material.color.setHex(isContact ? 0x22c55e : 0xf59e0b);
          foot.scale.setScalar(isContact ? 1.0 : 0.8);
        }

        var line = robotGroup.getObjectByName('leg_' + name);
        if (line && footData) {
          var fp2 = sim2rfu(footData[0], footData[1], footData[2]);
          line.geometry.setFromPoints([
            new THREE.Vector3(hipPos[0], hipPos[1], hipPos[2]),
            new THREE.Vector3(fp2[0], fp2[1], fp2[2])
          ]);
        }
      });

      var contacts = legNames.filter(function(n) { return frame.c[n]; }).length;
      var total = legNames.length;
      var dist = Math.sqrt(base[0]*base[0] + base[1]*base[1]);
      statsEl.innerHTML = '接触足: ' + contacts + '/' + total + '<br>位移: ' + dist.toFixed(2) + 'm<br>高度: ' + base[2].toFixed(2) + 'm';
    }

    // ---- Animation loop ----
    var playing = true;
    var currentFrame = 0;
    var lastTime = performance.now();
    var frameDuration = 1000 / DATA.fps;

    function animate(now) {
      requestAnimationFrame(animate);

      if (playing) {
        var elapsed = now - lastTime;
        if (elapsed >= frameDuration) {
          lastTime = now;
          currentFrame = (currentFrame + 1) % DATA.nframes;
          slider.value = currentFrame;
          updateRobot(currentRobot, currentFrame);
          timeEl.textContent = (currentFrame / DATA.fps).toFixed(1) + 's';
        }
      }

      // Camera orbits in RFU (Z-up) space.
      // Camera is above the ground plane (Z>0), looking down at the scene.
      // Orbit radius in the XY (ground) plane, height in Z.
      var t = now * 0.0001;
      var radius = 5.0;
      var camHeight = 3.5 + Math.sin(t * 0.5) * 0.5;
      camera.position.set(
        Math.cos(t) * radius,       // X: orbits left-right
        Math.sin(t) * radius - 1,   // Y: orbits forward-back
        camHeight                    // Z: height above ground
      );
      camera.lookAt(0, 0, 0.2);

      renderer.render(scene, camera);
    }

    // ---- Controls ----
    playBtn.addEventListener('click', function() {
      playing = !playing;
      playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
      if (playing) lastTime = performance.now();
    });

    resetBtn.addEventListener('click', function() {
      currentFrame = 0;
      slider.value = 0;
      trailPoints = [];
      updateRobot(currentRobot, 0);
      timeEl.textContent = '0.0s';
    });

    slider.addEventListener('input', function() {
      playing = false;
      playBtn.textContent = '▶ 播放';
      currentFrame = parseInt(slider.value);
      updateRobot(currentRobot, currentFrame);
      timeEl.textContent = (currentFrame / DATA.fps).toFixed(1) + 's';
    });

    tabBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        tabBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentRobot = btn.dataset.robot;
        buildRobot(currentRobot);
        trailPoints = [];
        updateRobot(currentRobot, currentFrame);
      });
    });

    // ---- Resize ----
    var ro = new ResizeObserver(function() {
      var w = wrap.clientWidth, h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
    ro.observe(wrap);

    // ---- Init ----
    buildRobot(currentRobot);
    updateRobot(currentRobot, 0);
    requestAnimationFrame(animate);
  })();
  </script>
</div>

</body>
